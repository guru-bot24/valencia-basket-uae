<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes vbWaPulse { 0%, 100% { box-shadow: 0 8px 24px rgba(7,0,0,0.25), 0 0 0 0 rgba(255,108,14,0.45); } 50% { box-shadow: 0 8px 24px rgba(7,0,0,0.25), 0 0 0 14px rgba(255,108,14,0); } }
</style>
</helmet>
<header style="position: sticky; top: 0; z-index: 60; background: #ffffff; border-bottom: 1px solid #E6E4E2">
  <div style="max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 12px clamp(16px, 4vw, 40px)">
    <a href="./index.dc.html" style="display: flex; align-items: center; gap: 14px; color: #070000" style-hover="color: #070000">
      <img src="assets/vbc-crest.png" alt="Valencia Basket crest" style="width: 75px; height: auto; display: block">
      <span style="display: block">
        <span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em; line-height: 1">VALENCIA BASKET</span>
        <span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.32em; color: #FF6C0E; line-height: 1; margin-top: 4px">UAE</span>
      </span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display: flex; align-items: center; gap: clamp(14px, 1.6vw, 24px)">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="10">
          <a href="{{ l.href }}" style="font-size: 14px; font-weight: 500; letter-spacing: 0.03em; color: {{ l.color }}; white-space: nowrap" style-hover="color: #FF6C0E">{{ l.label }}</a>
        </sc-for>
        <a href="./book-trial.dc.html" style="background: #FF6C0E; color: #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.07em; text-transform: uppercase; padding: 11px 22px; white-space: nowrap" style-hover="background: #F18A00; color: #ffffff">Book a Free Trial</a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" aria-label="Menu" style="background: none; border: 1px solid #E6E4E2; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 5px">
        <span style="display: block; width: 22px; height: 2px; background: #070000"></span>
        <span style="display: block; width: 22px; height: 2px; background: #070000"></span>
        <span style="display: block; width: 22px; height: 2px; background: #FF6C0E"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <nav style="background: #070000; display: flex; flex-direction: column; padding: 12px 0">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="10">
        <a href="{{ l.href }}" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; color: {{ l.mColor }}; padding: 12px 28px" style-hover="color: #FF6C0E">{{ l.label }}</a>
      </sc-for>
      <a href="./book-trial.dc.html" style="margin: 14px 28px 16px 28px; background: #FF6C0E; color: #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; padding: 15px 24px; text-align: center" style-hover="background: #F18A00; color: #ffffff">Book a Free Trial</a>
    </nav>
  </sc-if>
</header>
<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
  <a href="https://wa.me/971544386838" aria-label="Chat with us on WhatsApp" style="position: fixed; right: 28px; bottom: 28px; z-index: 70; width: 60px; height: 60px; border-radius: 50%; background: #FF6C0E; display: flex; align-items: center; justify-content: center; animation: vbWaPulse 2.6s ease infinite; transition: transform 0.2s ease" style-hover="transform: scale(1.08)">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <path d="M16 4.5c6.4 0 11.5 4.8 11.5 10.7S22.4 25.9 16 25.9c-1.6 0-3.1-.3-4.5-.8L5.6 27l1.8-5.2c-1.2-1.9-1.9-4.1-1.9-6.6C5.5 9.3 9.6 4.5 16 4.5z" fill="#ffffff"></path>
      <circle cx="11.5" cy="15.2" r="1.5" fill="#FF6C0E"></circle>
      <circle cx="16" cy="15.2" r="1.5" fill="#FF6C0E"></circle>
      <circle cx="20.5" cy="15.2" r="1.5" fill="#FF6C0E"></circle>
    </svg>
  </a>
</sc-if>
<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: flex; gap: 1px; background: #070000">
    <a href="./book-trial.dc.html" style="flex: 1.4; display: block; background: #FF6C0E; color: #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; padding: 16px 8px" style-hover="background: #F18A00; color: #ffffff">Book a Free Trial</a>
    <a href="https://wa.me/971544386838" style="flex: 1; display: block; background: #070000; color: #ffffff; font-weight: 600; font-size: 15px; text-align: center; padding: 18px 8px" style-hover="color: #FF6C0E">WhatsApp</a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 200}, &quot;active&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: false, open: false };
  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 979px)');
    this.on = () => this.setState({ isMobile: this.mq.matches, open: false });
    this.mq.addEventListener('change', this.on);
    this.on();
  }
  componentWillUnmount() { if (this.mq) this.mq.removeEventListener('change', this.on); }
  renderVals() {
    const active = this.props.active ?? '';
    const links = [['Programs','programs'],['Methodology','methodology'],['Coaches','coaches'],['Teams','teams'],['Facilities','facilities'],['Events','events'],['Blog','blog'],['Schools','schools'],['Admissions','admissions'],['Contact','contact']]
      .map(([label, slug]) => ({ label, href: './' + slug + '.dc.html', color: active === slug ? '#FF6C0E' : '#070000', mColor: active === slug ? '#FF6C0E' : '#ffffff' }));
    return {
      links,
      isMobile: this.state.isMobile,
      isDesktop: !this.state.isMobile,
      open: this.state.open && this.state.isMobile,
      toggle: () => this.setState(s => ({ open: !s.open })),
    };
  }
}
</script>
</body>
</html>
