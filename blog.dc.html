<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Blog — Valencia Basket UAE | Club News, Training &amp; Valencia Trips</title>
<meta name="description" content="News and insight from Valencia Basket UAE — training articles, club announcements, Valencia trip reports and advice for basketball parents.">
<link rel="canonical" href="https://valenciabasket.ae/blog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@keyframes vbFadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
html, body { margin: 0; padding: 0; background: #ffffff; }
body { font-family: 'Barlow', sans-serif; color: #070000; }
a { color: #FF6C0E; text-decoration: none; }
a:hover { color: #F18A00; }
</style>
</helmet>
<div style="width: 100%; overflow-x: hidden; background: #ffffff">
<dc-import name="Header" active="blog" hint-size="100%,100px"></dc-import>

<section data-screen-label="Blog hero" style="background: #070000; padding: clamp(48px, 7vw, 72px) clamp(20px, 5vw, 48px)">
  <div style="max-width: 1200px; margin: 0 auto">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.3em; color: #FF6C0E; text-transform: uppercase; animation: vbFadeUp 0.6s ease both">Blog</div>
    <h1 style="animation: vbFadeUp 0.6s ease 0.08s both; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(42px, 6vw, 64px); line-height: 1; text-transform: uppercase; color: #ffffff; margin: 14px 0 0 0">From the club</h1>
  </div>
</section>

<section data-screen-label="Blog index" style="background: #ffffff; padding: clamp(40px, 6vw, 64px) clamp(20px, 5vw, 48px) clamp(56px, 8vw, 88px) clamp(20px, 5vw, 48px)">
  <div style="max-width: 1200px; margin: 0 auto">
    <div style="display: flex; flex-wrap: wrap; gap: 10px">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.pick }}" style="background: {{ c.bg }}; color: {{ c.color }}; border: 1px solid {{ c.border }}; font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 9px 18px; cursor: pointer" style-hover="border-color: #FF6C0E">{{ c.name }}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 40px">
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="6">
        <a href="./blog-sample-post.dc.html" style="display: block; border: 1px solid #E6E4E2; color: #070000; transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease" style-hover="border-color: #FF6C0E; color: #070000; transform: translateY(-4px); box-shadow: 0 12px 32px rgba(7,0,0,0.08)">
          <div style="height: 190px; overflow: hidden"><img src="{{ p.img }}" alt="{{ p.alt }}" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
          <div style="padding: 20px 24px 26px 24px">
            <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #FF6C0E">{{ p.cat }}</div>
            <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 25px; line-height: 1.05; text-transform: uppercase; margin-top: 10px">{{ p.title }}</div>
            <p style="font-size: 14px; line-height: 1.55; color: #5B6670; margin: 10px 0 0 0">{{ p.excerpt }}</p>
            <div style="font-size: 13px; color: #5B6670; margin-top: 14px">{{ p.date }}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
</section>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cat: 'All' };
  renderVals() {
    const all = [
      { title: 'Inside a Youth Academy session', cat: 'Training', date: '8 July 2026', excerpt: 'What 75 minutes of the Valencia method actually looks like — phase by phase.', img: 'https://images.unsplash.com/photo-1608245449230-4ac19066d2d0?auto=format&fit=crop&w=900&q=70', alt: 'Kids training on court' },
      { title: 'Valencia trip 2026: what players learned', cat: 'Valencia Trips', date: '24 June 2026', excerpt: 'Ten days inside L\'Alqueria del Basket — the sessions, the games, the standards.', img: 'https://images.unsplash.com/photo-1504450758481-7338eba7524a?auto=format&fit=crop&w=900&q=70', alt: 'Basketball hoop at sunset' },
      { title: 'Season 2026–27 registration opens', cat: 'Club News', date: '10 June 2026', excerpt: 'The new season starts 1 September. Term dates, programs and how to secure a place.', img: 'https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=900&q=70', alt: 'Ball through the net' },
      { title: 'How much basketball is right at age 9?', cat: 'Parents', date: '28 May 2026', excerpt: 'Long-term development means the right dose, not the maximum dose. A guide for parents.', img: 'https://images.unsplash.com/photo-1559692048-79a3f837883d?auto=format&fit=crop&w=900&q=70', alt: 'Young player with the ball' },
      { title: 'Why spacing is the first thing we teach', cat: 'Training', date: '14 May 2026', excerpt: 'Before plays, before sets — players learn to see and use space. Here\'s why.', img: 'https://images.unsplash.com/photo-1519861531473-9200262188bf?auto=format&fit=crop&w=900&q=70', alt: 'Arena hoop' },
      { title: 'U14s take second at Dubai league finals', cat: 'Club News', date: '2 May 2026', excerpt: 'A strong finish to the competitive season — and what the squad takes into next year.', img: 'https://images.unsplash.com/photo-1574623452334-1e0ac2b3ccb4?auto=format&fit=crop&w=900&q=70', alt: 'Basketball net close-up' },
    ];
    const names = ['All', 'Training', 'Club News', 'Valencia Trips', 'Parents'];
    const cur = this.state.cat;
    return {
      cats: names.map(name => ({
        name,
        pick: () => this.setState({ cat: name }),
        bg: name === cur ? '#070000' : '#ffffff',
        color: name === cur ? '#ffffff' : '#070000',
        border: name === cur ? '#070000' : '#E6E4E2',
      })),
      posts: cur === 'All' ? all : all.filter(p => p.cat === cur),
    };
  }
}
</script>
</body>
</html>
